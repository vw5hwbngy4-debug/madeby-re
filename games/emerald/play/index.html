    <script>
      // Display mode only. The emulator always lives in this one document.
      try {
        const q=new URLSearchParams(location.search).get('mode');
        const saved=sessionStorage.getItem('emerald-display-mode-v0.1.22.2');
        document.documentElement.dataset.emeraldMode=(q==='dex'||(!q&&saved==='dex'))?'dex':'regular';
      } catch(e) { document.documentElement.dataset.emeraldMode='regular'; }
    </script>

    <script>
      // From v0.1.3 onward, an old cached index can escape itself by checking an uncached version file.
      (async()=>{
        try {
          const r=await fetch('./VERSION.txt?cb='+Date.now(),{cache:'no-store'});
          const v=(await r.text()).trim();
          const seen=sessionStorage.getItem('pokefield-live-version');
          if(seen && seen!==v && !location.search.includes('pfv=')){
            sessionStorage.setItem('pokefield-live-version',v);
            location.replace('./?pfv='+encodeURIComponent(v)+'&cb='+Date.now());
            return;
          }
          sessionStorage.setItem('pokefield-live-version',v);
        } catch(e) {}
      })();
    </script>
