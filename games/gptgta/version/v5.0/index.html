function placeDistrictBlocks(){

 const ys=[{a:EDGE,b:corridors.h[0].a-1}];
 for(let i=0;i<corridors.h.length-1;i++)ys.push({a:corridors.h[i].b+1,b:corridors.h[i+1].a-1});

 for(const bx of xs){for(const by of ys){const w=bx.b-bx.a+1,h=by.b-by.a+1;if(w<5||h<5)continue;const cx=(bx.a+bx.b)/2,cy=(by.a+by.b)/2;const d=districtAt(cx,cy);
   if(d==='park'){for(let y=by.a;y<=by.b;y++)for(let x=bx.a;x<=bx.b;x++)if(getTile(x,y)==='void')setTile(x,y,'park');continue;}
   if(d==='industrial'){for(let y=by.a;y<=by.b;y++)for(let x=bx.a;x<=bx.b;x++)if(getTile(x,y)==='void')setTile(x,y,'industrial');}
   packBuildingsInBlock(bx.a+1,by.a+1,Math.max(0,w-2),Math.max(0,h-2),d);

function nearestRoadSide(tx,ty,w,h){
 const sides=[{s:'N',d:999},{s:'S',d:999},{s:'W',d:999},{s:'E',d:999}];
 for(let x=tx;x<tx+w;x++){for(let k=1;k<=3;k++){if(getTile(x,ty-k)==='sidewalk'||getTile(x,ty-k)==='road')sides[0].d=Math.min(sides[0].d,k);if(getTile(x,ty+h-1+k)==='sidewalk'||getTile(x,ty+h-1+k)==='road')sides[1].d=Math.min(sides[1].d,k);}}
 for(let y=ty;y<ty+h;y++){for(let k=1;k<=3;k++){if(getTile(tx-k,y)==='sidewalk'||getTile(tx-k,y)==='road')sides[2].d=Math.min(sides[2].d,k);if(getTile(tx+w-1+k,y)==='sidewalk'||getTile(tx+w-1+k,y)==='road')sides[3].d=Math.min(sides[3].d,k);}}
 sides.sort((a,b)=>a.d-b.d);return sides[0].d<999?sides[0].s:choose(['N','S','E','W']);

function packBuildingsInBlock(tx,ty,w,h,district){

 while(y<ty+h-size.minH){
   let bh=clamp(irand(size.minH,size.maxH),size.minH,Math.max(size.minH,ty+h-y));
   if(y+bh>ty+h)bh=ty+h-y;
   let x=tx;
   while(x<tx+w-size.minW){
     let bw=clamp(irand(size.minW,size.maxW),size.minW,Math.max(size.minW,tx+w-x));
     if(x+bw>tx+w)bw=tx+w-x;
     if(bw>=size.minW&&bh>=size.minH&&canPlaceBuilding(x,y,bw,bh))addBuilding(x,y,bw,bh,district);
     x+=bw+gap+irand(0,1);
   }
   y+=bh+gap+irand(0,1);
 }
}

function createRoadGraph(){
 let id=0;
 const nodeGrid=[];
 for(let yi=0;yi<roadH.length;yi++){nodeGrid[yi]=[];for(let xi=0;xi<roadV.length;xi++){const n={id:'n'+id++,xi,yi,tx:roadV[xi],ty:roadH[yi],x:roadV[xi]*TILE+TILE/2,y:roadH[yi]*TILE+TILE/2,phase:(xi*797+yi*431)%2600,district:districtAt(roadV[xi],roadH[yi])};nodes.push(n);nodeGrid[yi][xi]=n;outgoing.set(n.id,[]);}}
 function addSeg(from,to,dir){const s={id:'s'+segments.length,from:from.id,to:to.id,fromNode:from,toNode:to,dir,len:1,start:{x:from.x,y:from.y},end:{x:to.x,y:to.y},district:from.district};

   s.len=dist(s.start.x,s.start.y,s.end.x,s.end.y);segments.push(s);segById.set(s.id,s);outgoing.get(from.id).push(s);}

 for(let yi=0;yi<roadH.length-1;yi++)for(let xi=0;xi<roadV.length;xi++){addSeg(nodeGrid[yi][xi],nodeGrid[yi+1][xi],'S');addSeg(nodeGrid[yi+1][xi],nodeGrid[yi][xi],'N');}

function signalGreen(seg){const horizontal=seg.dir==='E'||seg.dir==='W';const p=Math.floor((gameTime*1000+seg.toNode.phase)/4200)%2;return horizontal?p===0:p===1;}
function chooseNextSegment(car){const outs=outgoing.get(car.seg.to)||[];if(!outs.length)return car.seg;let candidates=outs.filter(s=>s.dir!==opp(car.seg.dir));if(!candidates.length)candidates=outs;
 const straight=candidates.find(s=>s.dir===car.seg.dir);if(straight&&Math.random()<.68)return straight;
 const rightPref=candidates.filter(s=>s.dir!==car.seg.dir);return rightPref.length?choose(rightPref):choose(candidates);
}
function segmentPoint(seg,t){return {x:lerp(seg.start.x,seg.end.x,t),y:lerp(seg.start.y,seg.end.y,t)};}
function segmentMid(seg){return {x:(seg.start.x+seg.end.x)/2,y:(seg.start.y+seg.end.y)/2};}

function seedTraffic(){
 traffic=[];spawnStats.spawned=0;
 const startCenter={x:player.x+player.w/2,y:player.y+player.h/2};
 let attempts=0;
 // Prime the opening camera with real moving traffic. These are still graph cars, not free wandering cars.
 while(traffic.length<34&&attempts<2500){attempts++;const seg=segmentInRing(startCenter,180,930)||weightedSegmentNear(null,true);const type=choose(vehicleTypes);const c=makeTrafficCar(type,seg,Math.random());if(spaceOnSegment(c.seg,c.t,c.type,56)){traffic.push(c);spawnStats.spawned++;}}

 while(traffic.length<TRAFFIC_TARGET&&attempts<5000){attempts++;const seg=weightedSegmentNear(null,true);const type=choose(vehicleTypes);const c=makeTrafficCar(type,seg,Math.random());if(spaceOnSegment(c.seg,c.t,c.type,52)){traffic.push(c);spawnStats.spawned++;}}

function weightedSegmentNear(center,global=false){

function segmentInRing(center,minD,maxD){

function makeTrafficCar(type,seg,t){const h=handling[type];const p=segmentPoint(seg,t);return {type,seg,t,x:p.x-h.w/2,y:p.y-h.h/2,w:h.w,h:h.h,angle:angleForSeg(seg),speed:irand(70,125),targetSpeed:irand(90,145),hp:h.hp,maxHp:h.hp,driver:true,state:'clean',enteredIntersection:false,wait:0,stuck:0,recycleT:0,created:gameTime};}

function carAheadOnSegment(c){const arr=trafficBuckets.get(c.seg.id)||[];for(const o of arr){if(o===c)continue;if(o.t>c.t){const d=(o.t-c.t)*c.seg.len;if(d<94)return d;break;}}return Infinity;}
function updateTraffic(dt){
 rebuildTrafficBuckets();
 for(const c of traffic){
   const h=handling[c.type];const ahead=carAheadOnSegment(c);let desired=c.targetSpeed;
   if(ahead<42)desired=0;else if(ahead<86)desired*=.35;
   const toEnd=(1-c.t)*c.seg.len;
   const red=toEnd<STOP_DIST&&!signalGreen(c.seg)&&!c.enteredIntersection;
   if(red)desired=0;
   const accel=(desired>c.speed?90:210)*dt;c.speed+=clamp(desired-c.speed,-accel,accel);
   if(c.speed<2){c.wait+=dt;if(c.wait>5&&ahead===Infinity&&!red){c.seg=chooseNextSegment(c);c.t=0;c.wait=0;}}else c.wait=0;
   c.t+=(c.speed*dt)/c.seg.len;
   if(c.t>.90)c.enteredIntersection=true;
   while(c.t>=1){c.seg=chooseNextSegment(c);c.t-=1;c.enteredIntersection=false;c.angle=angleForSeg(c.seg);}
   const p=segmentPoint(c.seg,c.t);c.x=p.x-c.w/2;c.y=p.y-c.h/2;c.angle=angleForSeg(c.seg);
   if(c.hp<c.maxHp*.35)c.state='damaged';
 }

function isRectOnCamera(o,pad=0){return o.x+o.w>camera.x-pad&&o.x<camera.x+SW+pad&&o.y+o.h>camera.y-pad&&o.y<camera.y+SH+pad;}

function streamTraffic(){

   const nc=makeTrafficCar(choose(vehicleTypes),seg,t);const p=segmentPoint(seg,t);if(isRectOnCamera({x:p.x-32,y:p.y-32,w:64,h:64},260))continue;

function spawnEjectedDriver(x,y,fromCar,byJacker=false){const mood=Math.random();peds.push({x:x+irand(-10,10),y:y+irand(-10,10),w:14,h:18,angle:0,goal:randomWalkPoint(),speed:byJacker?70:irand(38,58),wait:0,dead:false,driver:true,fleeT:byJacker?4:(mood<.5?5:0),reclaim:(!byJacker&&mood>.72)?fromCar:null,crossing:false});if(peds.length>145)peds.shift();}

function updatePed(p,dt,slowTick=false){
 if(p.dead)return;if(p.wait>0){p.wait-=dt;return;}
 if(p.driver&&p.fleeT>0){p.fleeT-=dt;const px=player.x+player.w/2,py=player.y+player.h/2;const dx=(p.x+p.w/2)-px,dy=(p.y+p.h/2)-py;const l=Math.hypot(dx,dy)||1;p.goal={x:p.x+dx/l*130,y:p.y+dy/l*130};}
 if(p.reclaim&&p.reclaim.remove)p.reclaim=null;
 if(p.reclaim&&Math.random()<.02)p.goal={x:p.reclaim.x+p.reclaim.w/2,y:p.reclaim.y+p.reclaim.h/2};
 if(!p.goal||dist(p.x,p.y,p.goal.x,p.goal.y)<10){p.goal=pedNextGoal(p);p.wait=Math.random()*.8;}
 const dx=p.goal.x-p.x,dy=p.goal.y-p.y,l=Math.hypot(dx,dy)||1;let nx=p.x+dx/l*p.speed*dt,ny=p.y+dy/l*p.speed*dt;
 const current=tileAtWorld(p.x+p.w/2,p.y+p.h/2),next=tileAtWorld(nx+p.w/2,ny+p.h/2);
 const allowed=isWalkTile(next)||(p.crossing&&next==='road');
 if(allowed&&!solidPropAt(nx,ny,p.w,p.h)){p.x=nx;p.y=ny;p.angle=quant8(dx,dy,p.angle);} else {p.goal=pedNextGoal(p);p.wait=.25;}
 if(p.reclaim&&activeCar===p.reclaim&&player.onFoot===false&&dist(p.x,p.y,p.reclaim.x,p.reclaim.y)<28){setMsg('The ejected driver tries to reclaim the car, but you keep control.');p.fleeT=3;p.reclaim=null;}
}
function pedNextGoal(p){
 // Some pedestrians cross at major crosswalks, but only from sidewalk to sidewalk.
 const tx=Math.floor((p.x+p.w/2)/TILE),ty=Math.floor((p.y+p.h/2)/TILE);
 if(getTile(tx,ty)==='sidewalk'&&Math.random()<.30){const g=crosswalkAcross(tx,ty);if(g){p.crossing=true;return g;}}
 p.crossing=false;return randomWalkPoint();
}
function crosswalkAcross(tx,ty){const dirs=[[1,0],[-1,0],[0,1],[0,-1]];for(const d of dirs){let seenRoad=false;for(let k=1;k<8;k++){const t=getTile(tx+d[0]*k,ty+d[1]*k);if(t==='road')seenRoad=true;else if(seenRoad&&t==='sidewalk'){// wait if traffic close
 const gx=(tx+d[0]*k)*TILE+8,gy=(ty+d[1]*k)*TILE+7;for(const c of traffic){if(dist(c.x+c.w/2,c.y+c.h/2,tx*TILE+16,ty*TILE+16)<95&&c.speed>20)return null;}return {x:gx,y:gy};}else if(t==='building'||t==='water')break;}}return null;}
function updatePedestrians(dt){for(let i=0;i<peds.length;i++){const p=peds[i];const far=distToPlayer(p)>1000;if(far&&(frame+i)%4!==0)continue;updatePed(p,far?dt*4:dt,far);}for(const j of carjackers)updateCarjacker(j,dt);}
function updateCarjacker(j,dt){if(j.dead)return;if(j.inCar)return;if(j.cool>0)j.cool-=dt;let target=null,best=9999;if(j.cool<=0&&Math.random()<.018){for(const c of traffic){if(!c.driver)continue;const d=dist(j.x,j.y,c.x,c.y);if(d<best&&d<145&&c.speed<70){target=c;best=d;}}}
 if(target){j.goal={x:target.x+target.w/2,y:target.y+target.h/2};if(best<25){traffic=traffic.filter(c=>c!==target);const wc=makeWorldCar(target.type,target.x,target.y,target.angle,true);wc.chaosT=7;wc.driver=false;worldCars.push(wc);spawnEjectedDriver(target.x,target.y,wc,true);j.inCar=true;j.cool=50;setMsg('Rare NPC carjacker stole a slow car. Chaos is local, not systemic.',240);return;}}
 if(!j.goal||dist(j.x,j.y,j.goal.x,j.goal.y)<12){j.goal=randomWalkPoint();j.cool=Math.max(j.cool,6+Math.random()*8);}const dx=j.goal.x-j.x,dy=j.goal.y-j.y,l=Math.hypot(dx,dy)||1;const nx=j.x+dx/l*j.speed*dt,ny=j.y+dy/l*j.speed*dt;if(isWalkTile(tileAtWorld(nx+j.w/2,ny+j.h/2))&&!solidPropAt(nx,ny,j.w,j.h)){j.x=nx;j.y=ny;j.angle=quant8(dx,dy,j.angle);}else j.goal=randomWalkPoint();}

function solidPropAt(x,y,w,h){const b={x,y,w,h};for(const d of decor){if(d.solid&&overlap(b,d))return d;}return null;}
function solidWorldAt(x,y,w,h){const pts=[[x+2,y+2],[x+w-2,y+2],[x+2,y+h-2],[x+w-2,y+h-2],[x+w/2,y+h/2]];for(const p of pts)if(isSolidTile(tileAtWorld(p[0],p[1])))return true;return !!solidPropAt(x,y,w,h);}
function worldCarHit(x,y,w,h,self){const b={x,y,w,h};for(const c of worldCars){if(c===self||c.remove||c.hp<=0)continue;if(overlap(b,c))return c;}return null;}
function trafficCarHit(x,y,w,h){const b={x,y,w,h};for(const c of traffic){if(overlap(b,c))return c;}return null;}
function updatePlayer(dt){
 if(player.punchT>0)player.punchT-=dt;
 if(activeCar){updatePlayerCar(dt);player.x=activeCar.x+activeCar.w/2-player.w/2;player.y=activeCar.y+activeCar.h/2-player.h/2;return;}
 const mag=Math.hypot(input.x,input.y);if(mag>.08){const sp=(input.boost?132:86);const dx=input.x/mag,dy=input.y/mag;let nx=player.x+dx*sp*dt,ny=player.y+dy*sp*dt;player.angle=quant8(dx,dy,player.angle);if(!solidWorldAt(nx,player.y,player.w,player.h))player.x=nx;if(!solidWorldAt(player.x,ny,player.w,player.h))player.y=ny;}
 if(input.action)doPunch();
}
function updatePlayerCar(dt){const c=activeCar,h=handling[c.type];const mag=Math.hypot(input.x,input.y);if(mag>.08){const dx=input.x/mag,dy=input.y/mag;c.angle=quant8(dx,dy,c.angle);}const f=fwdFromAngle(c.angle);const throttle=mag>.08?Math.max(-.55,(input.x*f.x+input.y*f.y)/mag):0;const boost=input.boost?1.32:1; if(throttle>0){c.vx+=f.x*h.acc*boost*dt;c.vy+=f.y*h.acc*boost*dt;}else if(throttle<-.1){c.vx-=f.x*h.acc*.45*dt;c.vy-=f.y*h.acc*.45*dt;}c.vx*=Math.pow(h.fric,dt*60);c.vy*=Math.pow(h.fric,dt*60);let sp=Math.hypot(c.vx,c.vy),mx=h.max*boost;if(sp>mx){c.vx=c.vx/sp*mx;c.vy=c.vy/sp*mx;}
 let nx=c.x+c.vx*dt,ny=c.y+c.vy*dt;let hit=false;
 if(!solidWorldAt(nx,c.y,c.w,c.h)&&!worldCarHit(nx,c.y,c.w,c.h,c)){c.x=nx;}else{hit=true;c.vx*=-.24;}
 if(!solidWorldAt(c.x,ny,c.w,c.h)&&!worldCarHit(c.x,ny,c.w,c.h,c)){c.y=ny;}else{hit=true;c.vy*=-.24;}
 const tc=trafficCarHit(c.x,c.y,c.w,c.h);if(tc){const impact=Math.hypot(c.vx,c.vy);if(impact>135){damageTrafficCar(tc,Math.round((impact-120)/7));c.vx*=.55;c.vy*=.55;setMsg('Hard player collision damaged traffic. Normal traffic remains stable.',140);}else{c.vx*=.82;c.vy*=.82;}}
 if(hit&&sp>175){c.hp-=Math.round((sp-160)/18);addEffect('sparks',c.x+c.w/2,c.y+c.h/2);if(c.hp<=0){destroyWorldCar(c);}}
 if(input.action)doPunch();
 if(c.chaosT>0){c.chaosT-=dt;if(c.chaosT<=0&&!isRectOnCamera(c,250)){c.remove=true;}}
}
function damageTrafficCar(c,amount){c.hp-=amount;c.state=c.hp<c.maxHp*.35?'damaged':'clean';if(c.hp<=0){addEffect('smoke',c.x+c.w/2,c.y+c.h/2);if(Math.random()<.22)addEffect('explosion',c.x+c.w/2,c.y+c.h/2);traffic=traffic.filter(o=>o!==c);}}
function destroyWorldCar(c){c.hp=0;c.state='destroyed';addEffect('explosion',c.x+c.w/2,c.y+c.h/2);setMsg((handling[c.type]?.label||'CAR')+' wrecked. No spawn chaos, only player-caused damage.',180);if(activeCar===c){activeCar=null;player.x=c.x+c.w+8;player.y=c.y;}}
function doPunch(){if(player.punchT>0)return;player.punchT=.35;const f=fwdFromAngle(player.angle);const hit={x:player.x+player.w/2+f.x*18-14,y:player.y+player.h/2+f.y*18-14,w:28,h:28};for(const p of peds){if(!p.dead&&overlap(hit,p)){p.dead=true;addEffect('blood',p.x+p.w/2,p.y+p.h/2);setMsg('Pedestrian knocked down.');return;}}for(const j of carjackers){if(!j.dead&&overlap(hit,j)){j.dead=true;addEffect('blood',j.x+j.w/2,j.y+j.h/2);setMsg('Carjacker down.');return;}}}

function tryEnter(){
 if(activeCar){if(scrapIfPossible())return;activeCar.vx*=.2;activeCar.vy*=.2;player.x=activeCar.x+activeCar.w+8;player.y=activeCar.y+activeCar.h/2-player.h/2;activeCar=null;setMsg('Exited vehicle.');return;}
 let best=null,bestD=62,bestTraffic=false;
 for(const c of worldCars){if(c.remove||c.hp<=0)continue;const d=dist(player.x,player.y,c.x,c.y);if(d<bestD){best=c;bestD=d;bestTraffic=false;}}
 for(const c of traffic){const d=dist(player.x,player.y,c.x,c.y);if(d<bestD){best=c;bestD=d;bestTraffic=true;}}
 if(!best){setMsg('Move closer to a vehicle.');return;}
 if(bestTraffic){traffic=traffic.filter(c=>c!==best);const wc=makeWorldCar(best.type,best.x,best.y,best.angle,true);wc.vx=0;wc.vy=0;wc.driver=false;worldCars.push(wc);spawnEjectedDriver(wc.x,wc.y,wc,false);activeCar=wc;lastStolenCar=wc;setMsg('Carjacked '+handling[wc.type].label+'. Driver ejected cleanly.');}
 else {if(best.driver){spawnEjectedDriver(best.x,best.y,best,false);best.driver=false;best.stolen=true;lastStolenCar=best;}activeCar=best;setMsg('Entered '+handling[best.type].label+'.');}
}
function scrapIfPossible(){if(!activeCar)return false;if(activeCar.type==='helicopter'){setMsg('Harbor Scrap only accepts road vehicles.');return false;}if(!overlap(activeCar,SCRAP)){setMsg('Drive a stolen car into Harbor Scrap, then press Enter.');return false;}if(!activeCar.stolen){setMsg('Scrap yard wants stolen cars. Carjack traffic first.');return false;}const value=scrapValue(activeCar);player.money+=value;addEffect('smoke',activeCar.x+activeCar.w/2,activeCar.y+activeCar.h/2);activeCar.remove=true;worldCars=worldCars.filter(c=>c!==activeCar);player.x=SCRAP.x-28;player.y=SCRAP.y+SCRAP.h/2;activeCar=null;lastStolenCar=null;setMsg('HARBOR SCRAP paid $'+value+'. Clean removal, no duplicate driver.',300);return true;}
function scrapValue(c){const h=handling[c.type];const hp=clamp(c.hp/c.maxHp,.25,1);return Math.round(h.value*hp);}
function updateWorldCars(dt){for(const c of worldCars){if(c.remove)continue;if(c!==activeCar&&c.chaosT>0){const jitter=frame%70<35?1:-1;c.angle+=jitter*.035;const f=fwdFromAngle(c.angle);c.vx+=f.x*handling[c.type].acc*.5*dt;c.vy+=f.y*handling[c.type].acc*.5*dt;c.vx*=.96;c.vy*=.96;let nx=c.x+c.vx*dt,ny=c.y+c.vy*dt;if(!solidWorldAt(nx,c.y,c.w,c.h))c.x=nx;else c.vx*=-.4;if(!solidWorldAt(c.x,ny,c.w,c.h))c.y=ny;else c.vy*=-.4;}}
 worldCars=worldCars.filter(c=>!c.remove);
}
function addEffect(kind,x,y){effects.push({kind,x,y,t:0,life:kind==='explosion'?0.8:kind==='sparks'?.35:1.4});if(effects.length>80)effects.shift();}
function updateEffects(dt){for(const e of effects)e.t+=dt;effects=effects.filter(e=>e.t<e.life);}

function updateInput(){let x=0,y=0;if(keys.has('arrowleft')||keys.has('a'))x-=1;if(keys.has('arrowright')||keys.has('d'))x+=1;if(keys.has('arrowup')||keys.has('w'))y-=1;if(keys.has('arrowdown')||keys.has('s'))y+=1;const l=Math.hypot(x,y);if(l>0){input.x=x/l;input.y=y/l;}input.boost=keys.has('q');input.action=keys.has(' ');}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys.add(k);if(k==='enter'){e.preventDefault();tryEnter();}if(['arrowup','arrowdown','arrowleft','arrowright',' ','q'].includes(k))e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
function bindButton(id,on,off){const el=document.getElementById(id);const start=e=>{e.preventDefault();on();};const end=e=>{e.preventDefault();off&&off();};el.addEventListener('pointerdown',start);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('pointerleave',end);}
bindButton('btnBoost',()=>input.boost=true,()=>input.boost=false);bindButton('btnAction',()=>input.action=true,()=>input.action=false);bindButton('btnEnter',()=>tryEnter(),()=>{});
const stick=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');let stickId=null;
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e);});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e);});function endStick(e){if(e.pointerId!==stickId)return;stickId=null;input.x=0;input.y=0;knob.style.left='36px';knob.style.top='36px';}
stick.addEventListener('pointerup',endStick);stick.addEventListener('pointercancel',endStick);
function moveStick(e){const r=stick.getBoundingClientRect();const cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const m=Math.hypot(dx,dy),max=42;if(m>max){dx=dx/m*max;dy=dy/m*max;}input.x=dx/max;input.y=dy/max;knob.style.left=(36+dx)+'px';knob.style.top=(36+dy)+'px';}

function draw(){
 const focus=activeCar||player;camera.x=clamp(focus.x+focus.w/2-SW/2,0,WORLD_W-SW);camera.y=clamp(focus.y+focus.h/2-SH/2,0,WORLD_H-SH);
 ctx.fillStyle='#101112';ctx.fillRect(0,0,SW,SH);ctx.save();ctx.translate(-camera.x,-camera.y);
 drawTiles();drawRoadDetails();drawScrapYard();drawBuildings();drawDecor();drawPeds();drawTraffic();drawWorldCars();drawPlayer();drawEffects();if(DEBUG_ROAD_GRAPH)drawRoadDebug();if(DEBUG_TRAFFIC)drawTrafficDebug();ctx.restore();drawHUD();
}
function drawTiles(){const sx=Math.max(0,Math.floor(camera.x/TILE)-1),sy=Math.max(0,Math.floor(camera.y/TILE)-1),ex=Math.min(MAP_W-1,Math.ceil((camera.x+SW)/TILE)+1),ey=Math.min(MAP_H-1,Math.ceil((camera.y+SH)/TILE)+1);for(let y=sy;y<=ey;y++)for(let x=sx;x<=ex;x++){const t=getTile(x,y);const px=x*TILE,py=y*TILE;if(t==='road'){const v=roadV.some(c=>Math.abs(x-c)<=1),h=roadH.some(c=>Math.abs(y-c)<=1);drawAsset(v&&h?'roadX':v?'roadV':'roadH',px,py,TILE,TILE);}else if(t==='sidewalk')drawAsset('sidewalk',px,py,TILE,TILE);else if(t==='park')drawAsset('grass',px,py,TILE,TILE);else if(t==='industrial')drawAsset('concrete',px,py,TILE,TILE);else if(t==='harbor')drawAsset('harbor',px,py,TILE,TILE);else if(t==='water'){ctx.fillStyle='#1a3c48';ctx.fillRect(px,py,TILE,TILE);drawAsset('roadWet',px,py,TILE,TILE,.0,.35);}else if(t==='building'){ctx.fillStyle='#272727';ctx.fillRect(px,py,TILE,TILE);}else{ctx.fillStyle='#293028';ctx.fillRect(px,py,TILE,TILE);}}
}
function drawRoadDetails(){
 ctx.save();ctx.lineWidth=2;ctx.strokeStyle='rgba(245,226,142,.38)';ctx.setLineDash([18,18]);
 for(const c of roadH){ctx.beginPath();ctx.moveTo((roadV[0]-2)*TILE,c*TILE+TILE/2);ctx.lineTo((roadV[roadV.length-1]+2)*TILE,c*TILE+TILE/2);ctx.stroke();}
 for(const c of roadV){ctx.beginPath();ctx.moveTo(c*TILE+TILE/2,(roadH[0]-2)*TILE);ctx.lineTo(c*TILE+TILE/2,(roadH[roadH.length-1]+2)*TILE);ctx.stroke();}
 ctx.setLineDash([]);
 for(const n of nodes){if(n.id.startsWith('harbor'))continue;drawCrosswalk(n.x,n.y);}
 ctx.restore();
}
function drawCrosswalk(cx,cy){ctx.save();ctx.fillStyle='rgba(245,245,230,.78)';for(let i=-2;i<=2;i++){ctx.fillRect(cx-56+i*18,cy-72,10,34);ctx.fillRect(cx-56+i*18,cy+38,10,34);ctx.fillRect(cx-72,cy-56+i*18,34,10);ctx.fillRect(cx+38,cy-56+i*18,34,10);}ctx.restore();}
function drawScrapYard(){ctx.save();ctx.fillStyle='rgba(97,74,39,.64)';ctx.fillRect(SCRAP.x,SCRAP.y,SCRAP.w,SCRAP.h);ctx.strokeStyle='#e6b84f';ctx.lineWidth=4;ctx.strokeRect(SCRAP.x+3,SCRAP.y+3,SCRAP.w-6,SCRAP.h-6);ctx.fillStyle='rgba(0,0,0,.68)';ctx.fillRect(SCRAP.x+14,SCRAP.y+12,210,28);ctx.fillStyle='#ffd66a';ctx.font='bold 18px monospace';ctx.fillText('HARBOR SCRAP',SCRAP.x+24,SCRAP.y+33);ctx.font='12px monospace';ctx.fillText('ENTER = scrap stolen car',SCRAP.x+24,SCRAP.y+52);ctx.restore();}
function drawBuildings(){for(const b of buildings){if(!isVisibleRect({x:b.x,y:b.y,w:b.px,h:b.py},140))continue;drawBuilding(b);}}
function drawBuilding(b){const x=b.x,y=b.y,w=b.px,h=b.py;ctx.save();ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(x+8,y+8,w,h);for(let ty=0;ty<b.h;ty++)for(let tx=0;tx<b.w;tx++)drawAsset(b.roof,x+tx*TILE,y+ty*TILE,TILE,TILE);ctx.fillStyle='rgba(255,255,255,.035)';ctx.fillRect(x+2,y+2,w-4,h-4);for(let tx=0;tx<b.w;tx++){drawAsset('edgeH',x+tx*TILE,y,TILE,12);drawAsset('lipH',x+tx*TILE,y+h-10,TILE,10);}for(let ty=0;ty<b.h;ty++){drawAsset('edgeV',x,y+ty*TILE,12,TILE);drawAsset('lipV',x+w-10,y+ty*TILE,10,TILE);}drawAsset('cornerTL',x,y,18,18);drawAsset('cornerTR',x+w-18,y,18,18);drawAsset('cornerBL',x,y+h-18,18,18);drawAsset('cornerBR',x+w-18,y+h-18,18,18);
 // Windows on visible outer edges; storefronts isolated to commercial street-facing side.
 const wins=b.windows;for(let i=1;i<b.w-1;i+=2){const key=wins[(i+b.tx+b.ty)%wins.length];drawAsset(key,x+i*TILE+8,y+h-18,17,14);if(b.district==='downtown'&&i%4===1)drawAsset(wins[(i+2)%wins.length],x+i*TILE+8,y+7,17,14);}for(let j=1;j<b.h-1;j+=2){const key=wins[(j+b.tx*3+b.ty)%wins.length];drawAsset(key,x+w-18,y+j*TILE+8,14,17);}
 for(const p of b.roofProps)drawAsset(p.key,p.x,p.y,p.w,p.h,0,.95);
 if(b.storefronts.length)drawStorefronts(b);
 ctx.restore();}
function drawStorefronts(b){const stores=b.storefronts;for(let i=0;i<stores.length;i++){const s=stores[i];let px=b.x+TILE+((i*4)%Math.max(1,b.w-3))*TILE,py=b.y+b.py-25,rot=0,w=62,h=28;if(b.face==='N'){py=b.y-3;rot=Math.PI;}if(b.face==='E'){px=b.x+b.px-28;py=b.y+TILE+((i*4)%Math.max(1,b.h-3))*TILE;rot=-Math.PI/2;w=62;h=28;}if(b.face==='W'){px=b.x-33;py=b.y+TILE+((i*4)%Math.max(1,b.h-3))*TILE;rot=Math.PI/2;w=62;h=28;}drawAsset('entranceLarge',px,py,w,h,rot,.85);drawAsset(s.key,px,py,w,h,rot,1);}}
function drawDecor(){for(const d of decor){if(!isVisibleRect(d,70))continue;drawAsset(d.key,d.x,d.y,d.w,d.h,d.rot);}}
function drawPeds(){for(const p of peds){if(!isVisibleRect(p,70))continue;if(p.dead){drawAsset('blood',p.x-5,p.y+8,28,18);continue;}drawAsset(p.driver&&p.fleeT>0?'civRun':'civWalk',p.x,p.y,p.w,p.h,p.angle);}for(const j of carjackers){if(j.dead){drawAsset('blood',j.x-5,j.y+8,28,18);continue;}if(j.inCar)continue;if(isVisibleRect(j,80))drawAsset('gangWalk',j.x,j.y,j.w,j.h,j.angle);}}
function vehicleAsset(type,state){const s=state==='destroyed'||state==='burned'||state==='damaged'?state:'clean';return `${type}_${s}`;}
function drawVehicle(c){let state=c.hp<=0?'destroyed':c.hp<c.maxHp*.35?'damaged':c.state||'clean';drawAsset(vehicleAsset(c.type,state),c.x,c.y,c.w,c.h,c.angle);if(DEBUG_TRAFFIC&&c.driver){ctx.strokeStyle='lime';ctx.strokeRect(c.x,c.y,c.w,c.h);}}
function drawTraffic(){for(const c of traffic)if(isVisibleRect(c,80))drawVehicle(c);}
function drawWorldCars(){for(const c of worldCars)if(isVisibleRect(c,100))drawVehicle(c);}
function drawPlayer(){if(activeCar)return;drawAsset(Math.hypot(input.x,input.y)>.08?'playerWalk':'playerIdle',player.x,player.y,player.w,player.h,player.angle);if(player.punchT>0){const f=fwdFromAngle(player.angle);ctx.fillStyle='rgba(255,230,120,.45)';ctx.fillRect(player.x+player.w/2+f.x*18-8,player.y+player.h/2+f.y*18-8,16,16);}}
function drawEffects(){for(const e of effects){const t=e.t/e.life;if(e.kind==='explosion'){const key=['explosion0','explosion1','explosion2','explosion3'][Math.min(3,(t*4)|0)];drawAsset(key,e.x-34,e.y-34,68,68,0,1-t*.15);}else if(e.kind==='smoke'){drawAsset(t<.5?'smoke0':'smoke1',e.x-22,e.y-22,44,44,0,1-t);}else if(e.kind==='sparks'){drawAsset('sparks',e.x-18,e.y-18,36,36,0,1-t);}else if(e.kind==='blood'){drawAsset('blood',e.x-18,e.y-10,36,22,0,.9);}}}
function drawRoadDebug(){ctx.save();ctx.lineWidth=2;for(const s of segments){ctx.strokeStyle=s.dir==='E'||s.dir==='W'?'rgba(80,220,255,.75)':'rgba(255,120,80,.75)';ctx.beginPath();ctx.moveTo(s.start.x,s.start.y);ctx.lineTo(s.end.x,s.end.y);ctx.stroke();}ctx.fillStyle='yellow';for(const n of nodes){ctx.fillRect(n.x-3,n.y-3,6,6);}ctx.restore();}
function drawTrafficDebug(){ctx.save();ctx.fillStyle='#0f0';ctx.font='12px monospace';let y=camera.y+20;ctx.fillText('traffic '+traffic.length+' near '+nearTrafficCount(),camera.x+20,y);ctx.fillText('recycled '+spawnStats.recycled+' spawned '+spawnStats.spawned,camera.x+20,y+16);ctx.restore();}
function drawHUD(){if(messageT>0)messageT--;msgPanel.textContent=message;const car=activeCar?handling[activeCar.type].label:'none';const zone=districtAt((player.x+player.w/2)/TILE,(player.y+player.h/2)/TILE);hud.innerHTML='$'+String(player.money).padStart(6,'0')+'<br>CAR: '+car+'<br>ZONE: '+zone.toUpperCase()+'<br>Traffic: '+traffic.length+' / near '+nearTrafficCount()+(DEBUG_SPAWN?'<br>Recycle: '+spawnStats.recycled:'');drawMinimap();}
function drawMinimap(){if(frame-lastMiniFrame<15)return;lastMiniFrame=frame;const w=92,h=92;if(!miniCanvas){miniCanvas=document.createElement('canvas');miniCanvas.width=w;miniCanvas.height=h;miniCtx=miniCanvas.getContext('2d');}const m=miniCtx;m.fillStyle='#101010';m.fillRect(0,0,w,h);for(let y=0;y<MAP_H;y+=2)for(let x=0;x<MAP_W;x+=2){const t=getTile(x,y);m.fillStyle=t==='road'?'#555':t==='sidewalk'?'#888':t==='building'?'#2e2e2e':t==='park'?'#285728':t==='water'?'#194653':t==='industrial'?'#5a523f':t==='harbor'?'#6b6045':'#1a211a';m.fillRect(x/MAP_W*w,y/MAP_H*h,1.6,1.6);}m.fillStyle='#ffd35a';m.fillRect((player.x/WORLD_W*w)-1,(player.y/WORLD_H*h)-1,3,3);m.fillStyle='#ff6b43';m.fillRect(SCRAP.x/WORLD_W*w,SCRAP.y/WORLD_H*h,4,4);mini.style.backgroundImage='url('+miniCanvas.toDataURL()+')';}

function tick(t){if(!lastT)lastT=t;let dt=Math.min(.035,(t-lastT)/1000);lastT=t;gameTime+=dt;frame++;updateInput();updateTraffic(dt);updatePedestrians(dt);updatePlayer(dt);updateWorldCars(dt);updateEffects(dt);draw();requestAnimationFrame(tick);}

Promise.all(Object.entries(A).map(([k,p])=>loadImg(k,p))).then(()=>{makeMap();setMsg('MEGA CITY: stable traffic graph online. No spawn explosions. Harbor Scrap active.',360);requestAnimationFrame(tick);});
</script>
