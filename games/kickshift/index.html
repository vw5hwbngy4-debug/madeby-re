<style>

ow:2}.dpad .down{grid-column:2;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.bottom{border-top:1px solid #30474c;padding-top:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}.bottom p{margin:0;color:#83aca9;font-size:11px;line-height:1.45}.bottom button{background:transparent;color:#e1e9dc;border:1px solid #54716a;border-radius:10px;padding:9px 11px;white-space:nowrap;font-weight:800;font-size:12px}.legend{margin-top:12px;display:flex;gap:16px;justify-content:center;color:#a4bdb6;font-size:11px}.legend i{display:inline-block;vertical-align:-3px;width:14px;height:14px;margin-right:4px;border-radius:4px;background:#d29c62;border:2px solid #f5ce8b}.legend .goal{background:#265758;border:2px solid var(--mint);border-radius:50%}.footer{margin-top:18px;text-align:center;font-size:10px;color:#73928f;letter-spacing:.2px}@media(max-width:375px){body{padding:11px 9px 24px}.brand h1{font-size:20px}.dpad{width:156px;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(2,48px);gap:5px}.touchzone{grid-template-columns:1fr 156px 1fr}.tool{font-size:11px;min-height:45px}.stats{margin-bottom:10px}.stat strong{font-size:22px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
.dpad .kick{grid-column:3;grid-row:1;font-size:12px;font-weight:950;color:#142e34;background:#f2b567;border-color:#ffdf9b}.rules{font-size:11px;line-height:1.45;padding:10px 12px 1px;color:#a8d1c8;text-align:center;min-height:25px}.rules strong{color:#ffcd83}.legend{flex-wrap:wrap;gap:7px 13px!important}.legend .sand{background:#d4b071;border-color:#ffe5ac}.legend .heavy{background:#7489a1;border-color:#dbe6f2}.legend .timer{background:#d07793;border-color:#ffbed0} .bottom{flex-wrap:wrap}.bottom p{flex:1 1 145px}.room-actions{display:flex;gap:7px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}.room-actions button{font-size:11px;padding:9px 10px}.room-actions #shuffle{border-color:#e3aa65;color:#ffcc86}.room-actions #shuffle:disabled{opacity:.4;cursor:not-allowed}.room-actions #next:disabled{opacity:.35;cursor:not-allowed;border-color:#3c5354;color:#8ba19d}
/* Compact play-first layout: no controls, paragraphs or legends below the puzzle. */
body{padding-top:12px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
.brand{margin-bottom:10px}.stats{gap:6px;margin-bottom:9px}.stat{padding:5px 3px}.stat strong{font-size:20px}.stat small{font-size:9px}
.quick-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.quick-actions .tool{min-width:0;min-height:42px;padding:6px 3px;font-size:12px;gap:3px;box-shadow:none}
.quick-actions .tool span{font-size:16px}
.board-frame{padding:6px;box-shadow:0 5px 0 #050d13,0 13px 30px #0005}
.board-top{gap:6px;padding:0 3px 6px;letter-spacing:0}.board-top #mission{flex:1;min-width:0}.board-top #proof{white-space:nowrap;font-size:10px}
.board-top .info{flex:none;border:1px solid #46646a;background:#1b353b;color:#caece0;border-radius:8px;width:25px;height:24px;padding:0;font-size:14px;font-weight:800;line-height:1}
.canvas-wrap .toast{position:absolute;z-index:4;left:8px;right:8px;bottom:8px;border:1px solid #83c7ae;background:#10272ef2;color:#eef8ed;border-radius:9px;padding:9px 10px;text-align:center;font-size:12px;line-height:1.35;pointer-events:none;box-shadow:0 3px 15px #0008}
.canvas-wrap .toast b{color:#ffcf86}.canvas-wrap .toast[hidden]{display:none}
.bottom{margin-top:17px;padding-top:12px;display:flex;flex-direction:column;align-items:stretch;gap:8px}
.bottom p{flex:auto;color:#83aca9;font-size:11px;line-height:1.3;text-align:center}
.room-actions{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0}
.room-actions button{min-width:0;width:100%;min-height:43px;font-size:12px;padding:8px 4px;text-align:center}
@media(max-width:480px){
:root{--hud-gap:4px}
html,body{min-height:100svh}
body{padding:8px 6px max(12px,env(safe-area-inset-bottom));overflow-x:hidden}
.app{max-width:min(100%,calc(100svh - 220px));display:flex;flex-direction:column;gap:0}
.brand{margin-bottom:7px;align-items:center}.mark{gap:8px}.logo{width:32px;height:32px;border-radius:10px;font-size:18px;box-shadow:2px 3px 0 #714b39}.eyebrow{display:none}.brand h1{font-size:18px;line-height:1}.infinite{padding:5px 8px;font-size:10px}.infinite span{font-size:13px}
.stats{gap:4px;margin-bottom:7px}.stat{padding:4px 2px;border-radius:10px}.stat small{font-size:8px;letter-spacing:1px}.stat strong{font-size:17px;line-height:1.15}
.quick-actions{gap:4px;margin-bottom:7px}.quick-actions .tool{min-height:34px;padding:4px 2px;font-size:10px;border-radius:10px}.quick-actions .tool span{font-size:13px}
.board-frame{padding:5px;border-radius:15px;box-shadow:0 4px 0 #050d13,0 10px 22px #0005}.board-top{padding:0 2px 5px;font-size:10px;gap:4px}.board-top #mission{font-size:10px;line-height:1.1}.board-top #proof{font-size:9px}.board-top .info{width:22px;height:22px;border-radius:7px;font-size:12px}
.bottom{margin-top:8px;padding-top:8px;gap:6px}.bottom p{display:none}.room-actions{gap:4px}.room-actions button{min-height:35px;padding:6px 2px;font-size:10px;border-radius:9px}
.footer{margin-top:10px;font-size:9px}
}
@media(max-width:375px){
body{padding:7px 5px max(10px,env(safe-area-inset-bottom))}
.app{max-width:min(100%,calc(100svh - 205px))}
.brand h1{font-size:17px}.infinite{padding:4px 7px;font-size:9px}.infinite span{font-size:12px}
.stats{margin-bottom:6px}.stat strong{font-size:16px}.quick-actions{gap:3px}.quick-actions .tool{min-height:32px;font-size:9px}.quick-actions .tool span{font-size:12px}
.board-top{font-size:9px}.board-top #mission{font-size:9px}.board-top #proof{font-size:8px}.room-actions{gap:3px}.room-actions button{font-size:9px;min-height:33px}
}

 if(Math.hypot(dx,dy)>23){const direction=Math.abs(dx)>Math.abs(dy)?dx>0?1:3:dy>0?2:0;if(E.solved(board,state))treasureDirection(direction);else sequence([direction]);return;}
 const r=canvas.getBoundingClientRect(),x=Math.floor((ev.clientX-r.left)/r.width*board.w),y=Math.floor((ev.clientY-r.top)/r.height*board.h);
 if(x>=0&&y>=0&&x<board.w&&y<board.h)tap(y*board.w+x);
});
canvas.addEventListener('pointercancel',()=>canvas._start=null);

 let dir={'ArrowUp':0,'ArrowRight':1,'ArrowDown':2,'ArrowLeft':3,w:0,d:1,s:2,a:3}[ev.key];
 if(dir!==undefined){ev.preventDefault();if(E.solved(board,state))treasureDirection(dir);else sequence([dir]);}else if(ev.key==='z'||ev.key==='Backspace'){$('undo').click();}else if(ev.key==='r')$('restart').click();else if(ev.key==='h')$('hint').click();
});

load(level);
